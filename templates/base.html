<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sentiment Lab{% endblock %}</title>
  <meta name="description" content="Sentiment Lab — unified sentiment analysis for text, datasets, YouTube comments and blog comments, with English VADER and multilingual model routing.">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ url_for('analyze_page') }}">SENTI<span>//</span>LAB</a>
      {% block header_extra %}{% endblock %}
    </div>
  </header>

  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <span>Sentiment Lab v2 — unified content intelligence.</span>
      <span>VADER (Hutto &amp; Gilbert, 2014) for English · transformer model for multilingual text.</span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
